# 5-band EQ sink for all playback; eq.py sets the gains. Bands must match eq.BANDS.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "FloppyPlayer EQ"
            media.name       = "FloppyPlayer EQ"
            filter.graph = {
                nodes = [
                    { type = builtin name = eq_band_1 label = bq_lowshelf  control = { "Freq" = 60.0    "Q" = 0.707 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_2 label = bq_peaking   control = { "Freq" = 250.0   "Q" = 1.0   "Gain" = 0.0 } }
                    { type = builtin name = eq_band_3 label = bq_peaking   control = { "Freq" = 1000.0  "Q" = 1.0   "Gain" = 0.0 } }
                    { type = builtin name = eq_band_4 label = bq_peaking   control = { "Freq" = 4000.0  "Q" = 1.0   "Gain" = 0.0 } }
                    { type = builtin name = eq_band_5 label = bq_highshelf control = { "Freq" = 12000.0 "Q" = 0.707 "Gain" = 0.0 } }
                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.floppyplayer_eq"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name    = "effect_output.floppyplayer_eq"
                node.passive = true
            }
        }
    }
]
